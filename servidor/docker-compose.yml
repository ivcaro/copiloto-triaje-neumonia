# El nombre de proyecto se declara aqui y no se hereda del directorio. Si se
# heredara seria `servidor`, y toda la seguridad de la vuelta atras dependeria de
# estar en la carpeta correcta al escribir `docker compose down`. Con el nombre
# explicito, `docker compose ls` y `down` se identifican solos.
name: copiloto-mcp

services:
  copiloto-mcp:
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    image: copiloto-mcp:0.1.0
    container_name: copiloto-mcp
    restart: unless-stopped
    # Sin `ports`: el servicio NO se expone a internet. n8n lo alcanza por
    # nombre de servicio dentro de la red interna, asi que la radiografia no
    # sale de la maquina EN ESTE TRAMO.
    #
    # El matiz importa y antes esta linea no lo tenia: decia «lo que garantiza
    # que la radiografia no salga de la maquina», a secas, y eso es falso del
    # recorrido completo. La placa llega hasta aqui POR TELEGRAM, o sea que ya
    # paso por servidores que no controlamos. Lo que esta linea defiende es el
    # tramo n8n -> copiloto, que si se queda dentro; el tramo Telegram -> n8n
    # esta declarado como riesgo en el §5.5 del spec de SP3.
    #
    # Lo senalo un evaluador externo el 26-sep: «si la radiografia se sube por
    # Telegram, pasa por servidores externos, asi que la afirmacion de que
    # nunca sale del hospital no se sostiene».
    environment:
      UMBRAL: "0.4258"
      # 0.8827 y no 0.883: es el AUC MEDIDO de estos pesos
      # (docs/frontera-recall-especificidad.md), y el servidor lo publica en cada
      # respuesta. Redondeado a 0.883 salia como "0,8830", afirmando un cuarto
      # decimal que es falso, y es justo lo que esta variable existe para evitar.
      AUC_VALIDACION: "0.8827"
      # 0.1466 = 134/914: la prevalencia de la cohorte de DERIVACION de la
      # regla de Heckerling (Ann Intern Med 1990;113:664-70, via PMC7422644,
      # tabla 2). Es la probabilidad previa de la combinacion bayesiana (SP4
      # §5) y se le ensena al profesional en cada informe con combinacion.
      # Sin default en el codigo a proposito, como AUC_VALIDACION: cuando
      # haya dato del entorno real se cambia AQUI, con su fuente en este
      # comentario. No es el 0.2215 del calibrador de imagen: RSNA son placas
      # ya indicadas, no la poblacion que llega a consulta con tos.
      PREVALENCIA_LOCAL: "0.1466"
      # torch NO mira el cgroup: sin esto abre un hilo por nucleo del HOST,
      # ignorando el limite de `cpus` de abajo, y se pelea por la CPU del VPS
      # con PostgreSQL y la API del cliente. Tiene que valer lo mismo que `cpus`.
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/salud').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Dos nucleos, no todos: el VPS es compartido con n8n, PostgreSQL y la
          # API del cliente, y este servicio es un invitado. Dos sobran para el
          # presupuesto del hito: la inferencia tarda 41 ms y el techo son
          # 4 000 ms, asi que hay margen de sobra aunque acotar la CPU la
          # encarezca. Romper lo que ya funciona costaria mucho mas que unos ms.
          cpus: "2"
          memory: 2G
    logging:
      # Sin esto, Docker escribe el log del contenedor sin limite ni rotacion en
      # /var/lib/docker/containers/<id>/<id>-json.log, en el disco del cliente.
      # No es hipotetico: el `healthcheck` de arriba consulta /salud cada 30 s y
      # uvicorn registra una linea por peticion, asi que son ~2 880 lineas al
      # dia -unos 200 MB al anio- ANTES de que pase un solo paciente. Ese disco
      # lo comparten dos PostgreSQL, [retirado] y n8n; cuando se llena, el que
      # muere no es este servicio.
      #
      # 10 MB x 3 ficheros = 30 MB como techo duro, y `docker logs --tail`
      # sigue funcionando igual para diagnosticar.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - [retirado]_network

  copiloto-bd:
    # Por digest y no por `postgres:16-alpine`: esa etiqueta es de un tercero y
    # se mueve con cada parche de Postgres/Alpine, asi que un redespliegue
    # rutinario en la maquina del cliente podria traer otra version de
    # PostgreSQL por sorpresa, sobre un volumen que ya tiene datos. Para
    # actualizar a proposito:
    #   docker pull postgres:16-alpine
    #   docker inspect postgres:16-alpine --format '{{index .RepoDigests 0}}'
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: copiloto-bd
    restart: unless-stopped
    environment:
      POSTGRES_DB: copiloto
      POSTGRES_USER: copiloto
      # Sin valor por defecto a proposito: si falta, el arranque falla de forma
      # visible en vez de levantar una base con una contrasena conocida.
      POSTGRES_PASSWORD: ${COPILOTO_BD_PASSWORD:?hay que declararla en .env}
    volumes:
      - copiloto_bd_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copiloto -d copiloto"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - [retirado]_network

networks:
  [retirado]_network:
    external: true
    # La red la posee la infraestructura del cliente, donde ya corre n8n. Este
    # servicio solo se une a ella: asi n8n lo alcanza por nombre de servicio y
    # la radiografia no sale de la maquina.
    name: ${RED_N8N:-[retirado]_[retirado]_network}

volumes:
  copiloto_bd_datos:
